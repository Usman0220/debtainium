<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33d17a"/>
      <stop offset="100%" stop-color="#26a269"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Plate with rounded corners -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle inner border highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Open Package Box Base -->
  <g id="box" transform="translate(24, 38)">
    <!-- Box Body -->
    <path d="M 6 36 L 40 50 L 74 36 L 74 62 L 40 76 L 6 62 Z" fill="#f6f5f4"/>
    <path d="M 40 50 L 74 36 L 74 62 L 40 76 Z" fill="#deddda"/>
    <!-- Left Flap -->
    <path d="M 6 36 L 40 50 L 32 30 L 2 20 Z" fill="#e1dedb"/>
    <!-- Right Flap -->
    <path d="M 74 36 L 40 50 L 48 30 L 78 20 Z" fill="#cdc7c2"/>
    <!-- Back Flap -->
    <path d="M 12 18 L 40 32 L 68 18 L 40 6 Z" fill="#9a9996" fill-opacity="0.4"/>
  </g>

  <!-- Obtainium-style Update Arrow Landing in Box -->
  <g id="updateArrow" transform="translate(64, 52)">
    <!-- Arrow Stem and Head -->
    <path d="M -9 -34 L 9 -34 L 9 -12 L 20 -12 L 0 12 L -20 -12 L -9 -12 Z"
          fill="url(#arrowGrad)"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linejoin="round"
          filter="url(#dropShadow)"/>
  </g>

  <!-- Debian Swirl Accent Symbol in top right corner -->
  <circle cx="94" cy="30" r="12" fill="#d70a53" filter="url(#dropShadow)"/>
  <path d="M 94 22 C 89.5 22 86 25.5 86 30 C 86 34.5 89.5 38 94 38 C 96.5 38 98.7 36.8 100 35 C 99 35.8 97.6 36.3 96.2 36.3 C 92.8 36.3 90 33.5 90 30.1 C 90 26.7 92.8 23.9 96.2 23.9 C 97.5 23.9 98.8 24.3 99.8 25 C 98.4 23.2 96.3 22 94 22 Z"
        fill="#ffffff"/>
</svg>
